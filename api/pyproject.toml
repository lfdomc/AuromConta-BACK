[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aurom-planilla-api"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
  "pyjwt[crypto]>=2.9",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "reportlab>=4.2",
  "openpyxl>=3.1",
  "lxml>=5.2",
  "signxml>=4.0",
  "cryptography>=43",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["fuentes/*.ttf"]

[tool.pytest.ini_options]
pythonpath = [".", "../motor/src"]
testpaths = ["tests"]
